[package]
name = "lumiere"
version = "1.0.0"
description = "Lecteur de musique local, design Fluent Windows 11"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
