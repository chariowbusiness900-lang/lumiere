<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUMIERE — Lecteur Musique</title><link rel="stylesheet" href="./styles.css"/></head>
<body>
<div class="titlebar"><span class="logo">✦ LUMIERE</span><div><button id="themeBtn">🌗 Theme : Systeme</button><span class="winbtns">— □ ✕</span></div></div>
<div class="layout">
<aside><nav>
<button data-view="biblio" class="active">📚 Bibliotheque</button>
<button data-view="favoris">♥ Favoris</button>
<button data-view="albums">💿 Albums</button>
<button data-view="artistes">🎤 Artistes</button>
<button data-view="playlists">🎵 Playlists</button>
<button data-view="recents">🕘 Recents</button>
<button data-view="ignores">🚫 Fichiers ignores</button>
<button data-view="parametres">⚙️ Parametres</button>
</nav>
<div class="folders"><h4>Dossiers suivis</h4><p id="foldersList">Musique (Windows)</p><button id="addFolder">+ Ajouter un dossier / fichiers</button><button id="rescan">↻ Rescanner maintenant</button></div>
<div class="hint">Glisse-depose tes MP3 ici. Filtres : &lt;60s ou &lt;100 Ko = ignores.</div></aside>
<main><header><input id="search" placeholder="Rechercher titre, artiste, album..."/><label>Duree min <input id="minDur" type="number" value="60"/> s</label><label>Taille min <input id="minSize" type="number" value="100"/> Ko</label></header><div id="view"></div></main>
</div>
<footer class="player"><div id="cover"></div><div class="now"><b id="nowTitle">Choisis un morceau</b><span id="nowArtist"></span><input id="seek" type="range" value="0"/><span id="time">0:00 / 0:00</span></div><div class="controls"><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button><button id="favBtn">♡</button><button id="fullscreen">⛶ Plein ecran</button></div><audio id="audio"></audio></footer>
<div id="nowPlaying" class="hidden"><button id="closeNP">✕ Fermer</button><div id="npCover"></div><h2 id="npTitle"></h2><p id="npArtist"></p><div id="palette"></div><div id="lyrics">Paroles (LRC) — synchronisation a venir.<br/>Le theme s'adapte a la pochette du morceau en cours.</div><div id="visualizer"></div></div>
<input type="file" id="filePicker" accept="audio/*,.mp3,.flac,.m4a,.ogg,.wav" multiple hidden/>
<script src="./app.js"></script></body></html>
