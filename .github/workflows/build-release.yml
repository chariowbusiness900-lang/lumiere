name: Build .exe LUMIERE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build avec Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LUMIERE ${{ github.ref_name }}'
          releaseBody: 'Version Windows de LUMIERE - lecteur musique Fluent.'
          releaseDraft: false
          prerelease: false
